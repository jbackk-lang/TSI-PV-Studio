<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TSI PV Studio — demo</title><style>body{font:16px system-ui;background:#101e18;color:#edf5ef;margin:40px auto;padding:20px;max-width:650px}form,output{display:grid;gap:12px;padding:20px;background:#20392c;border-radius:12px;margin-bottom:16px}label{display:flex;justify-content:space-between;gap:12px}button,input{font:inherit}output{white-space:pre-line}</style><h1>TSI PV Studio</h1><p>Demo bilansu na dwóch przykładowych godzinach. Południe: produkcja 5 kWh i zużycie 1 kWh. Wieczór: zużycie 3 kWh.</p><form><label>Pojemność magazynu (kWh)<input id="capacity" type="number" min="0" max="50" step=".1" value="2" required></label><label>Moc magazynu (kW)<input id="power" type="number" min="0" max="50" step=".1" value="2" required></label><button>Przelicz</button></form><output aria-live="polite"></output><script>
const form=document.querySelector('form'),out=document.querySelector('output'),fmt=new Intl.NumberFormat('pl-PL',{maximumFractionDigits:3});
form.onsubmit=e=>{e.preventDefault();const power=document.querySelector('#power').valueAsNumber,capacity=document.querySelector('#capacity').valueAsNumber;
const charge=Math.min(4,power,capacity/.95), discharge=Math.min(3,power,charge*.95*.95);
out.textContent=[['PV → dom',1],['PV → magazyn',charge],['PV → sieć',4-charge],['Magazyn → dom',discharge],['Sieć → dom',3-discharge]].map(([label,v])=>label+' · '+fmt.format(v)+' kWh').join('\n');};form.requestSubmit();
</script></html>
